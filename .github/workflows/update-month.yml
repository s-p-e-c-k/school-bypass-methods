name: Update Repo Month

on:
  schedule:
    - cron: '0 0 1 * *'   # Runs at midnight on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write   # Allow pushing commits back to the repo

jobs:
  update-month:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main   # Change to 'master' if that's your default branch

      - name: Update MONTH placeholder
        run: |
          month=$(date +'%B')
          sed -i "s/(MONTH)/($month)/g" "school-bypass-methods/web browser/Proxies/Proxy Links/Existing Proxy Links/⭐ InvisiProxy.md"

      - name: Fetch partner links
        run: |
          # Grab all <a href="..."> links from the partners page
          curl -s https://invisiproxy.com/partners \
            | grep -oP '(?<=href=")https?://[^"]+' \
            > partners.txt

          echo "### Partner Links ($month)" > partners_section.md
          while read -r link; do
            echo "- [$link]($link)" >> partners_section.md
          done < partners.txt

          # Append partner links to the monthly file
          cat partners_section.md >> "school-bypass-methods/web browser/Proxies/Proxy Links/Existing Proxy Links/⭐ InvisiProxy.md"

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update MONTH placeholder and partner links"
            git push origin HEAD
          fi
