name: Update Repo Month

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-month:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update month and partner links
        run: |
          month=$(date +'%B')
          file=$(find . -type f -name "*InvisiProxy.md" | head -n 1)

          # Fetch only partner hrefs from the glist container
          curl -s https://invisiproxy.com/partners \
            | pup 'div.glist a attr{href}' \
            > partners.txt

          # Build new section
          {
            echo "### Current Month's Links ($month)"
            echo ""
            while read -r link; do
              echo "- [$link]($link)"
            done < partners.txt
          } > new_section.md

          # Replace old section with new
          sed -i '/^### Current Month'\''s Links/,$d' "$file"
          cat new_section.md >> "$file"

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update MONTH placeholder and partner links"
            git push origin HEAD
          fi
