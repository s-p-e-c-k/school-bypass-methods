name: Update Repo Month

on:
  schedule:
    - cron: '0 0 1 * *'   # Runs at midnight on the 1st of every month
  workflow_dispatch:       # Manual trigger from Actions tab

jobs:
  update-month:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Opt into Node.js 24 now

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main   # Make sure this matches your default branch name

      - name: Update MONTH placeholder
        run: |
          month=$(date +'%B')
          # Replace {MONTH} in all Markdown files
          find . -type f -name "*.md" -print0 | xargs -0 sed -i "s/{MONTH}/$month/g"

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update MONTH placeholder to $month"
            git push
          fi
