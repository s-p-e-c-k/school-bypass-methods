name: Update Repo Month

on:
  schedule:
    - cron: '0 0 1 * *'   # Runs at midnight UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-month:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main   # change if your default branch is 'master'

      - name: Archive old links and update
        run: |
          month=$(date +'%B')
          file="web browse/Proxies/Proxy Links/Existing Proxy Links/⭐️ InvisiProxy/⭐️ InvisiProxy.md"
          archive="web browse/Proxies/Proxy Links/Existing Proxy Links/⭐️ InvisiProxy/InvisiProxy Links Archive.md"

          # If old section exists, append it directly to archive
          if grep -q '^### Current Month'\''s Links' "$file"; then
            {
              echo "### Archived Links ($month)"
              echo ""
              sed -n '/^### Current Month'\''s Links/,$p' "$file" | tail -n +2   # skip the header line
              echo ""
            } >> "$archive"
          fi

          # Extract only real domains (exclude descriptive text)
          curl -s https://invisiproxy.com/partners \
            | sed -n '/<div class="glist">/,/<\/div>/p' \
            | grep -oP '(?<=>)[^<]+' \
            | grep -E '([a-zA-Z0-9-]+\.)+(org|com|net|space|xyz|lol|life|bio|run|school|dev|world|info)$' \
            > "$(dirname "$file")/partners.txt"

          # Build new section
          {
            echo "### Current Month's Links ($month)"
            echo ""
            while read -r link; do
              echo "- [$link]($link)"
            done < "$(dirname "$file")/partners.txt"
          } > "$(dirname "$file")/new_section.md"

          # Replace old section with new
          sed -i '/^### Current Month'\''s Links/,$d' "$file"
          cat "$(dirname "$file")/new_section.md" >> "$file"

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Archive old links and update with new month"
            git push origin HEAD
          fi
