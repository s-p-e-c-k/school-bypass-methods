name: Update Repo Month

on:
  schedule:
    - cron: '0 0 1 * *'   # Runs at midnight on the 1st of every month
  workflow_dispatch:       # Allows manual trigger

jobs:
  update-month:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update MONTH placeholder
        run: |
          month=$(date +'%B')
          sed -i "s/{MONTH}/$month/" "school-bypass-methods/web browser/Proxies/Proxy Links/Existing Proxy Links/⭐ InvisiProxy.md"

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update MONTH placeholder to $month"
          git push
