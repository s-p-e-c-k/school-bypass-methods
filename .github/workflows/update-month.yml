name: Update Repo Month

on:
  schedule:
    - cron: '0 0 1 * *'   # Runs at midnight UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write   # Allow pushing commits back to the repo

jobs:
  update-month:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main   # Change if your default branch is 'master'

      - name: Update MONTH placeholder
        run: |
          month=$(date +'%B')
          # Find the target file by name and replace (MONTH)
          file=$(find . -type f -name "*InvisiProxy.md")
          sed -i "s/(MONTH)/($month)/g" "$file"

      - name: Fetch partner links
        run: |
          month=$(date +'%B')
          curl -s https://invisiproxy.com/partners \
            | grep -oP '(?<=href=")https?://[^"]+' \
            > partners.txt

          {
            echo ""
            echo "### Partner Links ($month)"
            while read -r link; do
              echo "- [$link]($link)"
            done < partners.txt
          } >> $(find . -type f -name "*InvisiProxy.md")

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update MONTH placeholder and partner links"
            git push origin HEAD
          fi
