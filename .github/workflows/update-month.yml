name: Update Repo Month

on:
  schedule:
    - cron: '0 0 1 * *'   # Runs at midnight on the 1st of every month
  workflow_dispatch:       # Allows manual trigger from Actions tab

jobs:
  update-month:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Opt into Node.js 24 now

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # Updated to v4 for Node.js 24 support

      - name: Update MONTH placeholder
        run: |
          month=$(date +'%B')
          # Safely replace {MONTH} in all Markdown files
          find . -type f -name "*.md" -print0 | xargs -0 sed -i "s/{MONTH}/$month/g"

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update MONTH placeholder to $month" || echo "No changes to commit"
          git push
